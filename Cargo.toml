[package]
name = "bouchonneur"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Déployeur de bouchons pour DmpConnect-JS2"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = { version = "0.36.1", default-features = false, features = ["svg"] }
rfd = "0.17.2"
tempfile = "3.27.0"
thiserror = "2.0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
